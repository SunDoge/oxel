[package]
name = "oxel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Oxel compiler CLI and language server"
readme = "../../README.md"
include = ["/src", "/LICENSE"]

[lib]
name = "oxel"

[[bin]]
name = "oxel"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
oxel-compiler = { version = "0.1.0", path = "../oxel-compiler" }
lsp-server = "0.7"
lsp-types = "0.97"
notify = "8.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
syn = { version = "2", features = ["full"] }
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
url = "2.5"
usage-rs = { version = "7.4", default-features = false, features = ["help", "diagnostics"] }

[[bench]]
name = "compiler"
harness = false

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libloading = "0.8.9"
