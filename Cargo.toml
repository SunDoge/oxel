[workspace]
members = [".", "crates/oxel-compiler"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
blake3 = "1"

[package]
name = "oxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust-based compiler for a CLR-native programming language"

[dependencies]
blake3.workspace = true
oxel-compiler = { version = "0.1.0", path = "crates/oxel-compiler" }
lsp-server = "0.7"
lsp-types = "0.97"
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
url = "2.5"
usage-rs = { version = "7.4", default-features = false, features = ["help", "diagnostics"] }

[[bench]]
name = "compiler"
harness = false
