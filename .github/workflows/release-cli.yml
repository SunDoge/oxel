name: Release CLI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified bundle to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oxel-release-cli
  cancel-in-progress: false

jobs:
  bundle:
    name: Build and verify Linux x86-64 CLI
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.91.0
    outputs:
      bundle: ${{ steps.package.outputs.bundle }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install the minimum Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Build and check the Linux bundle
        id: package
        shell: bash
        run: bash scripts/package-cli.sh release
      - uses: actions/upload-artifact@v6
        with:
          name: oxel-linux-x86_64
          path: |
            release/${{ steps.package.outputs.bundle }}
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish CLI on GitHub Releases
    needs: bundle
    if: inputs.publish && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: oxel-linux-x86_64
          path: "${{ runner.temp }}/oxel-release"
      - name: Check bundle integrity
        working-directory: "${{ runner.temp }}/oxel-release"
        run: sha256sum -c SHA256SUMS
      - name: Create the release draft with release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the bundle and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.bundle.outputs.tag }}
          RELEASE_BUNDLE: ${{ needs.bundle.outputs.bundle }}
          RELEASE_DIR: ${{ runner.temp }}/oxel-release
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "$RELEASE_DIR/$RELEASE_BUNDLE" "$RELEASE_DIR/SHA256SUMS" --clobber
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false
          else
            mkdir "$RELEASE_DIR/published"
            gh release download "$RELEASE_TAG" --pattern "$RELEASE_BUNDLE" --pattern SHA256SUMS --dir "$RELEASE_DIR/published"
            cd "$RELEASE_DIR/published"
            cmp SHA256SUMS "$RELEASE_DIR/SHA256SUMS"
            sha256sum -c SHA256SUMS
          fi
